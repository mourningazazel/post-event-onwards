[namespace.brand]
open = true
rule = "must name a brand in content/brands"
desc = "Brand relationship (N010)."

[namespace.emits]
open = true
rule = "must name a scent channel (registry/scent.toml), optionally with strength suffix: emits.rot or emits.rot.8"
desc = "Scent emission profile (M14)."

[namespace.mat]
open = true
rule = "material family, auto-derived from composition (mat.metal, mat.wood, mat.textile, mat.polymer, mat.glass, mat.paper, mat.stone, mat.organic, mat.rubber, mat.ceramic)"
desc = "Material-family queries (fire, reactions, crafting)."

