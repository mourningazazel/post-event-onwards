# Tag namespaces and registered tags (content-model §2.6, §9).
# open = true  -> any tag under the namespace is allowed (still validated by rule if given).
# open = false -> only tags registered below as [tag."ns.x"] are allowed.
# `name_part` on a tag composes it into item names just by being present (N010).

[namespace.cat]
open = true
rule = "catalogue category, dotted hierarchy, e.g. cat.food.canned, cat.tool.hand, cat.clothing.top"
desc = "Loot tables, UI grouping, generation queries."

