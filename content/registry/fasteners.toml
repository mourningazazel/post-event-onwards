[fastener.stitch]
unit = "stitch_cm"
hold_per_unit = 10
set_time_s = 0
geometry = "contact"
surface_match = { fibrous = 100, porous = 60 }
impact_tolerance = 6
weaknesses = ["age"]
removable = "cut"
tools = "sew>=3"
items_tag = "cat.fastener.thread"

# Joint status thresholds (Hold / Load), content-model §7.
[status]
secure = 200   # percent
firm = 125
wobbly = 100
