items_tag = "cat.fastener.nail"

[fastener.weld]
unit = "cm"
hold_per_unit = 150
set_time_s = 60
geometry = "contact"
surface_match = { smooth = 100, rough = 100, round = 100, irregular = 80 }
materials_only = ["mat.metal"]
impact_tolerance = 10
weaknesses = []
removable = "break"
tools = "weld>=5"
