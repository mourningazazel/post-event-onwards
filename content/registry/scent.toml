# Scent channels (scent-mobs.md; N004 lures/repellents; N007 smoke).
# `dead_default` is how a regular scent-only dead weighs the channel:
# positive attracts, negative repels (archetype tables may override).

[scent.human]
desc = "Living human: breath, sweat, skin. The player's default emission."
dead_default = 10

[scent.blood]
desc = "Fresh blood (wounds, fresh kills)."
dead_default = 8

[scent.flesh]
desc = "Raw meat, fish, fresh carcasses — usable as lures."
dead_default = 5

[scent.rot]
desc = "Decay: corpses, corpse gore, spoiled meat. Dominant masking scent."
dead_default = 0

[scent.food]
desc = "Cooked/packaged food, cooking smells."
dead_default = 1

[scent.smoke]
desc = "Burning, fire, exhaust. Masks and mildly repels (N007)."
dead_default = -3

[scent.chemical]
desc = "Fuel, solvents, bleach, ammonia. Masks; strong doses repel."
dead_default = -2

[scent.perfume]
desc = "Perfume, cologne, strong soaps and air fresheners. Masks human scent at close range."
dead_default = -1

# Dominance (who masks whom): perceived(c) = raw(c) * D / (D + sum dominance(d->c) * raw(d)).
# Values 0..10; tuning data for the Fields system.
[dominance]
D = 10
rot = { human = 8, blood = 4, food = 6 }
smoke = { human = 5, blood = 3, food = 5, flesh = 3, perfume = 6 }
chemical = { human = 4, blood = 2, food = 4, perfume = 5 }
perfume = { human = 3 }
