roles.tube = { desc = "hose/tubing", need = [ { feature = "tube" }, { capability = "siphon", min = 1 } ] }
roles.source = { desc = "tank or container holding liquid", need = [ { any = [ [ { feature = "fuel_tank" } ], [ { feature = "container" } ] ] } ] }
roles.dest = { desc = "container below the source", need = [ { param = "container.compat", has = "liquid" }, { compatible_with = "liquid" } ] }
