# Actions: what the player (or anyone) can do, with the item requirements the engine checks.
# Used by the engine later and NOW by tools/content/test.py to prove chains are feasible
# against authored content (survival-actions.md §4; N011).
#
# Each action:
#   desc, mechanics = [...], skill, difficulty (0..20), min_skill (expert gate, default 0),
#   tool_substitution (capability points bought per skill point above difficulty, default 0.25),
#   time_s (base), noise, roles.<role> = { desc, need = [predicate, ...], optional = bool }
#
# Predicates (all must hold for a role; `any = [[...],[...]]` = at least one group holds):
#   { feature = "container" }                          item has feature
#   { param = "container.compat", has = "liquid" }     list param contains value
#   { param = "tube.length_mm", min = 500 }            numeric param bounds (min/max)
#   { capability = "cut", min = 3 }                    derived/authored capability >= min
#   { capability = "cut", vs = "target" }              capability >= hardness of role 'target' main material
#   { prop = "mass_g", max = 5000 }                    numeric property bounds
#   { shape_in = ["rod", "blade"] }
#   { tag = "use.fire_starter" }  / { tag_prefix = "cat.food" }
#   { has_salvage = true } / { salvage_yields = "hose" }
#   { substance = true }                               role is a substance record
#   { substance_param = "flash_point_c", max = 30 }
#   { holds_substance_of = "source" }                  container/fuel_tank compatible with role's substance
#   { compatible_with = "liquid_role" }                container materials not attacked by that substance
#   { divisible_mode = "length" }
#   { flammable_min = "moderate" }                     material/substance flammability at least

# ---------- substances & containers (M1) ----------
[action.pour_out]
desc = "Empty a container onto the ground or into another."
mechanics = ["M1", "M2"]
skill = "survival"
difficulty = 0
time_s = 10
noise = "quiet"
roles.container = { desc = "container being emptied", need = [ { feature = "container" }, { param = "container.opening_mm", min = 1 } ] }

[action.fill_container]
desc = "Fill a container with a liquid/granular substance from a source."
mechanics = ["M1"]
skill = "survival"
difficulty = 0
time_s = 30
noise = "quiet"
roles.dest = { desc = "container to fill", need = [ { feature = "container" }, { compatible_with = "liquid" } ] }
roles.liquid = { desc = "substance", need = [ { substance = true } ] }

[action.siphon]
desc = "Siphon liquid from a tank to a lower container through a tube."
