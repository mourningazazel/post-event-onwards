# Outdoor object sets (world-catalog §4). Schema: registry/schemas.toml [schema.outdoor_set].
#
# A set is rolled once per INSTANCE:
#   street sets (residential_street, downtown_street, highway_corridor): per ~100 m street segment
#   yard sets (front_yard, backyard): per residential lot
#   lot/site sets (parking_lot, gas_station_forecourt, industrial_yard, construction_site,
#     school_grounds, farmyard, trailer_park, campground, park_grounds): per site
#   alley, emergency_scene: per occurrence
# Each object spawns count=[min,max] with probability chance_pct (default 100).
# Vehicles are baseline (as parked at the event); wrecks, flat tyres, broken glass and looted
# interiors come from aftermath state modifiers (N005/N007), not from separate sets.
# An `item` may name a loot table (struggle_debris): its rolls are scattered on the ground.

