# Building types: residential (world-catalog §2). Schema: registry/schemas.toml [schema.building].
#
# Conventions shared by every buildings/*.toml file:
#
# - footprint_m = [[width_min, width_max], [depth_min, depth_max]] in metres, per building.
# - walls = interior partition finish; exterior = outer wall cladding/structure (what a player
#   breaches from outside); roof = roof covering. Material ids from content/materials/.
#   vinyl siding = pvc, aluminium siding = aluminum, stucco/block/tilt-up = concrete.
# - rooms: counts are for the WHOLE building. Multi-unit buildings (duplex, apartments) list the
#   total across all units; the generator groups them into units of one kitchen + living room
#   + bedrooms + bathroom. floor: ground | upper | basement | any. Rooms on "basement" only
#   exist when the basement roll (basement_pct) succeeds. "attic" on "upper" sits under the roof.
# - occupants: who was inside at the event (N005/N007, P-IT-03), by time bucket:
#     night        23:00-06:00 any day
#     weekday_day  08:00-17:00 Mon-Fri
#     weekend_day  08:00-17:00 Sat-Sun
#     evening      17:00-23:00 any day
#   Commute hours (06-08) blend the neighbouring buckets. Each entry spawns count=[min,max]
#   (uniform) with probability chance_pct (default 100). Customers, visitors and guests use the
#   casual profiles at_home_adult / retiree / child_student / teen_student.
#   Residential households: ~2.5 people per US household, ~10% of homes vacant; weekday daytime
#   ~40% of residents at home (retirees, home-makers, remote workers, pre-schoolers).
# - loot_priority: how early other survivors stripped the place (aftermath looting, N005).
# - utilities: power = grid | none, water = mains | well | none. A "well" property keeps water
#   regardless of the neighbourhood roll (N007); power always follows the neighbourhood roll.

[building.ranch_house]
context = "ctx.home"
desc = "A single-storey detached house, long and low under a shallow gable roof, typically 2-4 bedrooms with an attached garage; the commonest American post-war house."
