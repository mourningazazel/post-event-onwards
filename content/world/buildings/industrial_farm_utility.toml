# Building types: industrial, farm and utility (world-catalog §2).
# Conventions (footprint, materials, room counts, occupant time buckets, chance_pct, utilities):
# see the header of buildings/residential.toml.
#
# Manual labour (warehouse pickers, factory line staff, yard hands) uses the construction_worker
# profile: work boots, work trousers, hi-vis, gloves. Plant operators use mechanic.
# Utility sites (power_substation, water_treatment, water_tower) drive the neighbourhood power
# and water rolls (N007); they are placed by the generator, not by setting weights.

[building.warehouse]
context = "ctx.industrial"
desc = "A distribution warehouse: a tilt-up concrete box of pallet racking and floor stacks, a row of dock doors, a small office and break room; many run around the clock."
footprint_m = [[50, 200], [30, 120]]
floors = [1, 1]
basement_pct = 0
walls = "concrete"
exterior = "concrete"
roof = "mild_steel"
rooms = [
  { room = "warehouse_floor", count = [1, 2], floor = "ground" },
  { room = "loading_dock", count = [1, 3], floor = "ground" },
  { room = "workshop", count = [0, 1], floor = "ground" },
  { room = "private_office", count = [1, 4], floor = "any" },
  { room = "break_room", count = [1, 1], floor = "any" },
  { room = "restroom_public", count = [1, 2], floor = "any" },
]
occupants = [
  { profile = "construction_worker", count = [5, 80], when = ["weekday_day"] },
  { profile = "construction_worker", count = [2, 40], chance_pct = 60, when = ["evening", "night", "weekend_day"] },
  { profile = "office_worker", count = [1, 8], when = ["weekday_day"] },
  { profile = "trucker", count = [0, 6], when = ["weekday_day", "evening", "night"] },
  { profile = "delivery_driver", count = [0, 6], when = ["weekday_day"] },
  { profile = "security_guard", count = [1, 1], chance_pct = 40, when = ["night", "weekend_day"] },
]
outdoor = ["industrial_yard", "parking_lot"]
loot_priority = "medium"
utilities = { power = "grid", water = "mains" }
tags = ["cat.building.industrial"]

