# Building types: retail and food service (world-catalog §2).
# Conventions (footprint, materials, room counts, occupant time buckets, chance_pct, utilities):
# see the header of buildings/residential.toml.
#
# Staffing follows typical US store hours: most shops trade ~09:00-21:00, so "evening" carries
# reduced staff and shoppers; "night" is only staffed where 24-hour trading is common
# (convenience stores, gas stations, some supermarkets/pharmacies, fast-food drive-thrus), shown
# as a chance_pct. Night stockers and cleaners keep big stores from ever being truly empty.

