# Industrial room types (world-catalog §3), pre-event baseline.

[room.warehouse_floor]
desc = "A warehouse floor: pallet racking and floor pallets, forklifts, drums, hand trucks."
size_m2 = [500, 10000]
floor = "ground"
tags = ["from.industrial"]
objects = [
  { item = "metal_shelving", count = [10, 100], contains = ["warehouse_pallet"] },
  { item = "pallet", count = [10, 120], contains = ["warehouse_pallet"] },
  { item = "forklift", count = [1, 6] },
  { item = "hand_truck", count = [2, 8] },
  { item = "drum_55gal", count = [0, 20] },
  { item = "fire_extinguisher", count = [2, 10] },
]

[room.workshop]
desc = "A repair or fabrication workshop: workbenches and tool chests, parts shelving, a welder, a car on the lift."
