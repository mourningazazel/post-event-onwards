# Food-service room types (world-catalog §3), pre-event baseline.

[room.commercial_kitchen]
desc = "A restaurant kitchen: ranges, reach-in coolers and freezer, dry-storage shelving, sinks."
size_m2 = [20, 120]
floor = "ground"
tags = ["from.restaurant", "from.kitchen"]
objects = [
  { item = "stove_range", count = [1, 4] },
  { item = "refrigerator", count = [1, 3], contains = ["walk_in_cooler_stock"] },
  { item = "chest_freezer", count = [0, 2], contains = ["freezer_contents"] },
  { item = "metal_shelving", count = [2, 8], contains = ["restaurant_kitchen"] },
