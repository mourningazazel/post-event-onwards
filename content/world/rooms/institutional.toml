# Institutional room types (world-catalog §3): schools, library, hospital, police, fire, church.
# Pre-event baseline. Things carried by occupants (backpacks on students, duty belts on officers)
# come from profiles; rooms hold what is left in them.

# ---------------------------------------------------------------- school and library

