# Office room types (world-catalog §3), pre-event baseline.

[room.open_office]
desc = "An open-plan office floor: rows of workstations, filing cabinets, a printer corner."
size_m2 = [60, 1500]
floor = "any"
tags = ["from.office"]
objects = [
  { item = "kitchen_cabinet", count = [1, 1], purposes = { "drawer" = [{ purpose = "junk_drawer", w = 1 }], "cupboard" = [{ purpose = "maintenance_cabinet", w = 1 }] } },
  { item = "desk", count = [6, 60], contains = ["office_desk"] },
  { item = "office_chair", count = [6, 60] },
  { item = "desktop_pc", count = [4, 50] },
  { item = "filing_cabinet", count = [1, 10], contains = ["desk_clutter"] },
  { item = "bookshelf", count = [0, 4], contains = ["bookstore_shelf"] },
  { item = "fire_extinguisher", count = [1, 3] },
  { item = "smoke_detector", count = [2, 10] },
]

[room.private_office]
