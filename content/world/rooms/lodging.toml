# Lodging room types (world-catalog §3), pre-event baseline. Guests' luggage is a low-chance object
# since occupancy varies; the building's occupants come from profiles.

[room.motel_room]
desc = "A motel room: one or two beds, a TV, a small table, a Bible in the drawer, a bathroom."
size_m2 = [20, 35]
floor = "any"
tags = ["from.bedroom"]
objects = [
  { item = "bed_frame", count = [1, 2] },
  { item = "mattress", count = [1, 2] },
  { item = "nightstand", count = [1, 2], contains = ["book"] },
  { item = "dresser", count = [1, 1] },
  { item = "television", count = [1, 1] },
  { item = "dining_table", count = [1, 1], chance_pct = 60 },
  { item = "dining_chair", count = [1, 2] },
  { item = "refrigerator", count = [1, 1], chance_pct = 50 },
  { item = "microwave", count = [1, 1], chance_pct = 40 },
  { item = "toilet", count = [1, 1] },
  { item = "sink", count = [1, 1] },
  { item = "bathtub", count = [1, 1], chance_pct = 70 },
  { item = "duffel_bag", count = [1, 2], chance_pct = 45, contains = ["luggage"] },
  { item = "smoke_detector", count = [1, 1] },
]
loose = ["towel"]

[room.hotel_room]
desc = "A hotel room: beds, desk, armchair, minibar, in-room safe, a full bathroom, guests' bags."
size_m2 = [25, 50]
floor = "upper"
tags = ["from.bedroom"]
objects = [
  { item = "bed_frame", count = [1, 2] },
  { item = "mattress", count = [1, 2] },
  { item = "nightstand", count = [1, 2], contains = ["book"] },
  { item = "dresser", count = [1, 1] },
  { item = "desk", count = [1, 1], chance_pct = 70 },
  { item = "office_chair", count = [1, 1], chance_pct = 70 },
  { item = "armchair", count = [1, 1] },
  { item = "television", count = [1, 1] },
  { item = "refrigerator", count = [1, 1], chance_pct = 60, contains = ["minibar"] },
  { item = "safe", count = [1, 1], chance_pct = 70 },
  { item = "toilet", count = [1, 1] },
  { item = "sink", count = [1, 1] },
  { item = "bathtub", count = [1, 1], chance_pct = 80 },
  { item = "duffel_bag", count = [1, 2], chance_pct = 50, contains = ["luggage"] },
  { item = "laptop_bag", count = [1, 1], chance_pct = 15, contains = ["laptop"] },
  { item = "smoke_detector", count = [1, 1] },
]
loose = ["towel"]
