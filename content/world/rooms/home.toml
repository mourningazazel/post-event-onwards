# Home room types (world-catalog §3), pre-event baseline. Doors and windows are placed by the
# building generator and are not listed. Objects are furniture and fixtures; containers carry
# `contains` loot. `floor` is the usual storey; building records may override it.
# Firearm placement (target ~1 in 3 homes): handguns in nightstand_drawer, long guns as low-chance
# closet objects, and home_safe (low chance) in master bedroom, closet, basement and home office.

[room.kitchen]
desc = "A home kitchen: fridge, range, cabinets, pantry, sink; sometimes an eat-in table."
size_m2 = [8, 25]
floor = "ground"
tags = ["from.kitchen"]
objects = [
  { item = "refrigerator", count = [1, 1], contains = ["fridge_contents", "freezer_contents"] },
  { item = "stove_range", count = [1, 1] },
  { item = "microwave", count = [1, 1], chance_pct = 90 },
  { item = "kitchen_base_run", count = [3, 8] },
  { item = "kitchen_wall_run", count = [2, 6] },
  { item = "kitchen_pantry", count = [0, 1] },
  { item = "kitchen_sink_base", count = [1, 1] },
  { item = "sink", count = [1, 1] },
  { item = "dining_table", count = [1, 1], chance_pct = 35 },
  { item = "dining_chair", count = [0, 4] },
  { item = "smoke_detector", count = [1, 1], chance_pct = 80 },
