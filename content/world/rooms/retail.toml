# Retail room types (world-catalog §3), pre-event baseline: fully stocked. Shelving `count` is
# shelving sections; each section rolls its stock table.
# The five *_floor rooms after store_floor_generic are EXTRA (not in world-catalog §3): specialty
# sales floors, so the specialty stock tables (§7) have a room to live in.

[room.grocery_floor]
desc = "A supermarket sales floor: aisles of canned, dry and household goods, coolers, freezers, produce."
size_m2 = [400, 4000]
floor = "ground"
tags = ["from.grocery", "from.retail"]
objects = [
  { item = "metal_shelving", count = [6, 24], contains = ["grocery_shelf_canned"] },
  { item = "metal_shelving", count = [6, 24], contains = ["grocery_shelf_dry"] },
  { item = "metal_shelving", count = [4, 12], contains = ["grocery_household"] },
  { item = "metal_shelving", count = [3, 10], contains = ["grocery_produce"] },
  { item = "refrigerator", count = [4, 16], contains = ["grocery_drinks"] },
  { item = "refrigerator", count = [4, 12], contains = ["grocery_cold_case"] },
  { item = "chest_freezer", count = [3, 10], contains = ["grocery_freezer_case"] },
  { item = "shopping_cart", count = [5, 30] },
  { item = "fire_extinguisher", count = [1, 4] },
]

