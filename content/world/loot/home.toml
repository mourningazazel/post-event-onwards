# Home loot tables (world-catalog §7): the PRE-EVENT BASELINE, i.e. what a lived-in US home held
# the instant before the turning. Looting, spoilage, charring and damage are applied later by the
# aftermath pass (world-generation.md "Aftermath model"); only states true at baseline are used here
# (opened packages, dirty laundry, old worn or broken things put away in storage).
#
# Conventions: one pick = one entry; `count` is how many of that item the pick yields. Weights in a
# table sum to roughly 100 so they read as percent-per-pick.
# Firearms target ~1 in 3 US homes overall, spread over nightstands (handguns), closets (long guns,
# placed as room objects) and home safes.

