# Vehicle, personal and survivor-trace loot tables (world-catalog §7).
# car_*, wallet, purse, backpack and pockets are pre-event baseline. encampment_stash and
# struggle_debris are event/aftermath traces (N007): the aftermath pass places them, and their
# entries may carry event states (bloody, broken, empty) because that is what they depict.

