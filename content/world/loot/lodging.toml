# Lodging loot tables, pre-event baseline.

# Extra (not in world-catalog §7): a hotel minibar or in-room fridge.
[loot.minibar]
desc = "A hotel minibar: sodas, water, snacks and miniature bottles of liquor."
rolls = [2, 6]
empty_chance_pct = 10
entries = [
  { item = "soda_can", w = 30, count = [1, 4] },
  { item = "bottled_water", w = 25, count = [1, 3] },
  { item = "snack_bar", w = 20, count = [1, 4] },
  { item = "glass_bottle", w = 18, count = [1, 6], substance = "liquor", fill_pct = [100, 100], mods = ["size_small"] },
  { item = "glass_bottle", w = 7, count = [1, 2], substance = "beer", fill_pct = [100, 100] },
]

# Extra (not in world-catalog §7): a traveller's suitcase or duffel.
