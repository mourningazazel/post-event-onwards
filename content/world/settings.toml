# Settings (zones), world-catalog §1. Schema: registry/schemas.toml [schema.setting].
#
# - density: resident (night-time) people per km2, except where the catalogue gives a daytime
#   figure (commercial_strip, industrial). Building weights and occupant counts (buildings/*.toml)
#   are tuned so the night population of a typical neighbourhood lands in this range.
# - buildings: relative weights by building COUNT (not floor area) for ordinary lots.
#   Institutional sites (hospital, medical_clinic, police_station, fire_station, school, library,
#   church) and utility sites (power_substation, water_treatment, water_tower) are NOT in these
#   lists: the generator places them with spacing rules per population served (world-catalog §1).
# - outdoor: sets placed on streets and open land between buildings (buildings carry their own
#   yard/lot sets).
# - power_base_pct / water_base_pct: chance a neighbourhood's grid power / mains water still
#   works at the reference clock of day 7 (N007). The clock curve lowers both with time; power
#   falls faster and is lower the sparser the setting, so there is no hard city/wilderness break.
#   Properties with water = "well" ignore the neighbourhood water roll.
# - lot_m: typical lot frontage in metres.

[setting.downtown_core]
desc = "The city centre: office and apartment towers, hotels and banks over street-level shops and cafes, parking structures, alleys, and heavy traffic frozen in place."
density = [10000, 25000]
buildings = [
  { building = "office_tower", w = 18 },
  { building = "office_lowrise", w = 12 },
  { building = "highrise_apartment", w = 14 },
  { building = "walkup_apartment", w = 6 },
  { building = "hotel", w = 5 },
  { building = "bank", w = 5 },
  { building = "parking_garage", w = 8 },
  { building = "coffee_shop", w = 8 },
  { building = "fast_food", w = 5 },
  { building = "bar", w = 5 },
  { building = "diner", w = 2 },
  { building = "convenience_store", w = 5 },
  { building = "pharmacy", w = 3 },
  { building = "clothing_store", w = 4 },
  { building = "bookstore", w = 2 },
  { building = "liquor_store", w = 2 },
  { building = "sporting_goods", w = 1 },
  { building = "post_office", w = 1 },
]
outdoor = [
  { set = "downtown_street", w = 60 },
  { set = "alley", w = 25 },
  { set = "parking_lot", w = 8 },
  { set = "construction_site", w = 4 },
  { set = "emergency_scene", w = 3 },
]
power_base_pct = 55
water_base_pct = 90
lot_m = [20, 60]
tags = ["cat.setting.urban", "cat.setting.dense"]

