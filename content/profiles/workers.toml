# Occupant profiles: people at work at the event (world-catalog §5, P-IT-03, content-model §3.1).
# Schema: registry/schemas.toml [schema.profile]. A mob is an output of its environment (N008).
#
# occupancy: "<place>.<bucket>", bucket = night | weekday_day | weekend_day | evening (the time
#   buckets of buildings/residential.toml). Informative: buildings' occupants lists are what place
#   people; occupancy tells street/vehicle spawners and tests where the profile belongs.
# outfit: one weighted pick per slot; "none" = nothing in that slot. Slots:
#   underwear, socks, top, bottom, full_body, outer, footwear, headwear, hands, eyes, accessory
#   full_body (dress, coveralls, pajamas): when it rolls an item, top and bottom are NOT rolled
#     (coveralls go over underwear; a dress replaces top and bottom).
#   eyes: glasses / goggles, separate from accessory so glasses do not compete with a watch.
#   outer: coats are seasonal; the generator scales winter_coat / rain_jacket / fleece_jacket
#     weights by season and weather (content-model §3.1) and hi_vis/police/firefighter gear stays.
# pockets: every id spawns (items once; loot ids roll their table). Containers carry their own
#   contents: a wallet is filled from wallet_contents, a handbag from purse_contents, a
#   school_backpack from backpack_school (see those items' `why`).
# carried: one weighted pick (bag, tool, or held item).

