# Domain C modifiers and detail tables: clothing, bags, personal effects, hygiene, medical.
# N011 leanness: sizes, colours, occupational markings, drug kinds and keepsake subjects are
# generated here instead of being separate archetypes. Shared tables used by these items and
# defined elsewhere: clothing_colour, clothing_print, fabric_pattern (details.toml).

# ---- variants --------------------------------------------------------------------------------

[modifier.child_size]
kind = "variant"
applies_to = { tags_any = ["cat.clothing", "cat.bag"] }
name_part = { slot = "variant", text = "child's", order = 19 }
desc = "sized for a child"
ops = [ { path = "dims_mm", op = "mul", value = 0.6 }, { path = "mass_g", op = "mul", value = 0.35 } ]

[modifier.faux_leather]
kind = "material"
applies_to = { items = ["leather_jacket"] }
name_part = { slot = "variant", text = "faux", order = 24 }
desc = "made of vinyl-coated fabric imitating leather"
ops = [
  { path = "composition.shell.material", op = "set", value = "flexible_pvc" },
  { path = "armor.bite", op = "set", value = 2 },
  { path = "armor.cut", op = "set", value = 2 },
  { path = "durability", op = "add", value = -4 },
  { path = "mass_g", op = "mul", value = 0.6 },
  { path = "absorbs_water", op = "set", value = false },
]

