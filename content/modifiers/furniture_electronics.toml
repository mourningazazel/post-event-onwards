# Survivor notes (P-WO-14). Lore constraints: the turning was instant, simultaneous and not a
# sickness (N005); 80-99% turned (N007); no living people are ever met, so notes are traces of the
# dead or the departed. Many carry practical hints that teach real mechanics.
[detail_table.survivor_note_text]
applies_to = { items = ["survivor_note"] }
pick = 1
entries = [
  { w = 4, text = "'Mom was mid-sentence when it happened. Her eyes just emptied. I shut her in the pantry. I'm sorry I'm sorry I'm sorry.'", add_tags = ["flavor.sentimental"] },
  { w = 4, text = "'Everyone on the bus turned at the same moment. The driver too. We rolled into the median. I was the only one who climbed out.'" },
  { w = 4, text = "'They go where the noise is. I threw a bottle over the fence and the whole street turned its head like one animal.'" },
  { w = 4, text = "'Water heater in the basement still has forty gallons in it. Drain at the bottom, open a tap upstairs so it flows. Boil it anyway.'" },
  { w = 3, text = "'Smear them on you. I know. I KNOW. But they walked right past me.'" },
  { w = 3, text = "'Counted from the roof tonight: eleven lights in the whole city. Last night there were fourteen.'" },
  { w = 3, text = "'If you're reading this I didn't come back for it. Food is under the loose board by the radiator. Take it. Don't waste it.'" },
  { w = 3, text = "'Whatever this is, it isn't a sickness. A sickness doesn't take everyone in the same second.'" },
  { w = 3, text = "'Keep your doors shut. The ones inside got in because every house was open when it happened.'" },
  { w = 3, text = "'Their eyes are open but something else is looking out of them.'" },
  { w = 3, text = "'Pharmacy on Fifth is empty. Somebody got there before me, and then something got to them.'" },
  { w = 2, text = "'7:40 in the morning. I know because the kitchen clock was still right and nothing else was.'" },
  { w = 2, text = "'Radio is only the tone now. Even the automated weather voice stopped on Tuesday.'" },
  { w = 2, text = "'They lose you in the rain. I don't know how I know that, but I'm still here.'" },
  { w = 2, text = "'They don't sleep. They stand. A lot of them stand facing the church.'" },
  { w = 2, text = "'The dog won't go near them. Won't even growl. She just shakes.'" },
  { w = 2, text = "'Hunger is louder than fear now. That's how you know it's been a week.'" },
  { w = 2, text = "'Stacked the desks against the stairwell door. Third floor is safe. Was safe.'" },
  { w = 2, text = "'NEED: D batteries, bleach, matches, insulin for Mrs. K. (doesn't matter now)'" },
  { w = 2, text = "'Sis — waited three days. Going north to the lake house. Mark the mailbox if you make it.'", add_tags = ["flavor.sentimental"] },
  { w = 1, text = "In a child's careful letters: 'i am being very quiet like dad said'", add_tags = ["flavor.sentimental"] },
  { w = 1, text = "A heading, 'the ones I put down', and a page and a half of tally marks." },
  { w = 1, text = "'Tape the button on a smoke alarm and throw it in a car. They crowd it for hours. Go the other way.'" },
]

