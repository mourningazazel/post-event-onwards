  { w = 10, text = "Sticky notes mark the chapters on drywall and leaky taps.", modifier = "manual_home_repair" },
  { w = 8, text = "A red cross on the cover; a phone number for poison control inside.", modifier = "manual_first_aid" },
  { w = 8, text = "A smiling instructor on the cover, mid-lunge.", modifier = "manual_fitness" },
  { w = 6, text = "Photos of a woman flipping a much larger attacker.", modifier = "manual_self_defense" },
  { w = 6, text = "Diagrams of stitches, a pattern envelope tucked in the back.", modifier = "manual_sewing" },
  { w = 5, text = "The state wildlife agency's crest on the cover.", modifier = "manual_hunter_education" },
  { w = 5, text = "Circuit diagrams with coffee rings on them.", modifier = "manual_electronics_basics" },
  { w = 5, text = "Exploded diagrams of pipe fittings.", modifier = "manual_plumbing" },
  { w = 5, text = "A troop number written inside the cover.", modifier = "manual_scout" },
  { w = 5, text = "A school library stamp; answers pencilled in the margins.", modifier = "manual_chemistry" },
  { w = 4, text = "Span tables and nail schedules, the spine cracked flat.", modifier = "manual_carpentry" },
  { w = 4, text = "Oil-stained fingerprints on the carburettor chapter.", modifier = "manual_small_engine" },
  { w = 4, text = "Advice on door chains, peepholes and 'deterring intruders'.", modifier = "manual_home_security" },
  { w = 3, text = "A chalk-dusted cover and knot diagrams on every other page.", modifier = "manual_climbing" },
  { w = 3, text = "Track drawings of deer, coyote and dog.", modifier = "manual_stalking" },
  { w = 3, text = "A pitching grip chart on the back cover.", modifier = "manual_pitching" },
  { w = 3, text = "Burn marks on the edges; somebody read it at the bench.", modifier = "manual_welding" },
  { w = 3, text = "Rows of mason jars on the cover, recipes for brine and syrup inside.", modifier = "manual_preserving" },
  { w = 3, text = "Charts of which knots hold and which slip.", modifier = "manual_wilderness_survival" },
  { w = 3, text = "Recipes for lye soap and poured candles.", modifier = "manual_soapmaking" },
