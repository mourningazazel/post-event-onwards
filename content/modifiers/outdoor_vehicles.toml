# Domain E modifiers and detail tables: vehicles, street, garden, farm, outdoors, sports, weapons.
# Variation that doesn't change behaviour lives here, not in new archetypes (N011).

# ---------------------------------------------------------------- variants / material swaps
[modifier.diesel_engine]
kind = "variant"
applies_to = { items = ["pickup_truck", "delivery_van"] }
name_part = { slot = "variant", text = "diesel", order = 24 }
desc = "a diesel-engined version"
ops = [ { path = "features.fuel_tank.fuel", op = "set", value = ["diesel"] } ]
weight = 2

[modifier.farm_tank_gasoline]
kind = "contents"
applies_to = { items = ["farm_fuel_tank"] }
name_part = { slot = "variant", text = "gasoline", order = 24 }
desc = "stencilled GASOLINE; kept for the pickup and small engines"
ops = [
  { path = "features.fuel_tank.fuel", op = "set", value = ["gasoline"] },
  { path = "contents.substance", op = "set", value = "gasoline" },
]
weight = 1

[modifier.round_bale]
kind = "variant"
applies_to = { items = ["hay_bale"] }
name_part = { slot = "variant", text = "round", order = 20 }
desc = "a half-tonne round bale, only movable by machine"
ops = [
  { path = "dims_mm", op = "set", value = [1500, 1500, 1200] },
  { path = "mass_g", op = "set", value = 500000 },
  { path = "fixed", op = "set", value = true },
  { path = "blocks", op = "set", value = "full" },
  { path = "blocks_sight", op = "set", value = true },
]

[modifier.container_40ft]
kind = "variant"
applies_to = { items = ["shipping_container"] }
name_part = { slot = "variant", text = "40-foot", order = 20 }
desc = "the long forty-foot size"
ops = [
  { path = "dims_mm", op = "set", value = [12192, 2591, 2438] },
  { path = "mass_g", op = "set", value = 3750000 },
  { path = "features.container.capacity_ml", op = "set", value = 67700000 },
]

# The generic aluminum_body (x0.4 mass) suits steel tools, not bats: aluminium bats weigh about
# the same as wood ones (the barrel is a thin hollow tube). This swaps material, keeps the mass.
[modifier.bat_aluminum]
kind = "material"
applies_to = { items = ["baseball_bat"] }
name_part = { slot = "variant", text = "aluminum", order = 25 }
desc = "a hollow aluminium bat that pings on impact"
ops = [
  { path = "composition.body.material", op = "set", value = "aluminum" },
  { path = "hollow", op = "set", value = true },
  { path = "mass_g", op = "mul", value = 0.95 },
]

[modifier.barbed_top]
kind = "variant"
applies_to = { items = ["chain_link_fence"] }
name_part = { slot = "variant", text = "barbed-topped", order = 24 }
desc = "topped with three strands of barbed wire on angled arms"
ops = [ { path = "features.climbable.difficulty", op = "add", value = 3 } ]
weight = 1

# ---------------------------------------------------------------- clock-driven states (N007)
[modifier.water_gone_foul]
kind = "contents"
applies_to = { items = ["backyard_pool", "rain_barrel", "water_trough"] }
desc = "green with algae, mosquito larvae wriggling at the surface"
ops = [ { path = "contents.substance", op = "set", value = "water_foul" } ]
clock_min_days = 21

[modifier.overgrown_hedge]
kind = "state"
applies_to = { items = ["hedge"] }
desc = "grown out into a wild, tangled wall"
ops = [
  { path = "dims_mm", op = "mul", value = 1.4 },
  { path = "blocks", op = "set", value = "full" },
]
clock_min_days = 90

[modifier.vine_covered]
kind = "state"
applies_to = { items = ["chain_link_fence", "wooden_fence"] }
desc = "smothered in climbing vines"
ops = [ { path = "blocks_sight", op = "set", value = true } ]
clock_min_days = 120

