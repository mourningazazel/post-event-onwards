# ================================================================ cookware and appliances
# Nonstick aluminum pan: a third of the weight, dents instead of cracking, and the coating
# gives off toxic fumes when overheated on an open fire.
[modifier.aluminum_cookware]
kind = "material"
applies_to = { items = ["frying_pan"] }
name_part = { slot = "variant", text = "aluminum", order = 25 }
desc = "a light aluminum pan with a scratched nonstick coating"
add_tags = ["hazard.fumes"]
ops = [
  { path = "mass_g", op = "mul", value = 0.4 },
  { path = "composition.body.material", op = "set", value = "aluminum" },
  { path = "attach_surface.kind", op = "set", value = "smooth" },
  { path = "reactions", op = "remove" },
]

# Gas burners light with a match when the grid is down (natural gas often keeps flowing for a
# while; rural homes run on a propane tank). The oven's glow-bar igniter still needs power.
