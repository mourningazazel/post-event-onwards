# Kitchen, food and drink modifiers and detail tables (domain A; N011 leanness).
#
# Food kinds follow one pattern: an archetype (canned_food, jar_food, ...) lists a *_kind detail
# table; each entry applies a `variant` modifier that
#   - sets `name` to the kind ("chili") and adds a variant name_part ("canned"), giving
#     "canned chili" / "Crestmoor canned chili" / "spoiled canned chili (opened)";
#   - sets the whole `food` table with realistic per-package values (US package sizes);
#   - changes dims/mass/material only where the real package differs.
# kcal figures are per package from typical US nutrition labels, rounded.

# ================================================================ canned food
[detail_table.canned_food_kind]
applies_to = { items = ["canned_food"] }
pick = 1
entries = [
  { w = 8, modifier = "canned_chicken_soup" }, { w = 6, modifier = "canned_tomato_soup" },
  { w = 7, modifier = "canned_chili" }, { w = 7, modifier = "canned_baked_beans" },
  { w = 6, modifier = "canned_corn" }, { w = 6, modifier = "canned_green_beans" },
  { w = 5, modifier = "canned_peaches" }, { w = 6, modifier = "canned_tuna" },
  { w = 3, modifier = "canned_luncheon_meat" }, { w = 4, modifier = "canned_beef_stew" },
  { w = 4, modifier = "canned_ravioli" },
]

[detail_table.canned_lid]
applies_to = { items = ["canned_food"] }
pick = 1
entries = [
  { w = 6, text = "The lid is plain steel; it needs an opener." },
  { w = 4, text = "The lid has a pull ring.", ops = [ { path = "food.needs_opening", op = "set", value = false } ] },
]

[detail_table.canned_label]
applies_to = { items = ["canned_food"] }
chance_pct = 15
pick = 1
entries = [
  { w = 5, text = "The label is water-stained and hard to read." },
  { w = 3, text = "The label has come off entirely; there's no telling what's inside." },
  { w = 3, text = "It's dented along one side." },
  { w = 1, text = "The ends bulge outward and spring back when pressed.", add_tags = ["hazard.toxic"] },
]

