# Liquids that add gameplay value (water, fuels, drinks, chemicals, body fluids).
# flash_point_c: omit for non-flammable. attacks: materials this substance degrades (container compat).

# ---- water ----
[substance.water]
phase = "liquid"
density_mg_ml = 1000
viscosity = "watery"
volatility = "low"
flammability = "none"
drinkable = true
hydration_pct = 100
extinguishes_fire = true
freezes_c = 0
surface = "spreads"
water_quality = "safe"
perishable = "shelf_stable"
desc = "Clean water: bottled, treated, tap (while water service works), water-heater tanks early on."

[substance.water_untreated]
phase = "liquid"
density_mg_ml = 1000
viscosity = "watery"
volatility = "low"
flammability = "none"
drinkable = true
hydration_pct = 100
extinguishes_fire = true
freezes_c = 0
surface = "spreads"
