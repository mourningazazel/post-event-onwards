desc = "Rain barrels, rivers, lakes, toilet cisterns, old tanks. Risky until boiled/treated."

[substance.water_foul]
phase = "liquid"
density_mg_ml = 1010
viscosity = "watery"
volatility = "low"
flammability = "none"
drinkable = true
hydration_pct = 90
toxic = "moderate"
