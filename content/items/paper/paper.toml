# Paper, books, maps, office and writing supplies, survivor notes. Domain D (world-catalog §6.D).
# Knowledge objects (M21) carry feature.readable. Skill manuals teach (N012): the SUBJECT is a
# variant modifier (modifiers/furniture_electronics.toml, manual_*) rolled from the
# `skill_manual_subject` detail table; it sets `teaches` and composes the name
# ("first aid manual", "emergency surgery textbook"). Titles, texts and markings are detail tables.
# `newspaper` lives in items/fire/fire.toml (exemplar).

# ---------------------------------------------------------------- books and manuals
[item.book]
name = "book"
tags = ["cat.paper.book", "from.living", "from.bedroom", "from.school", "from.retail", "from.office", "use.tinder", "use.fuel", "flavor.readable"]
shape = "block"
dims_mm = [178, 108, 25]
mass_g = 250
desc = "A paperback book."
glyph = "item.book"
why = "Reading for its own sake (world-building, titles by detail table); tinder and slow paper fuel."
details = ["book_title", "book_inscription"]
modifiers = ["book_hardcover"]
value_class = "junk"

[item.book.composition.pages]
material = "paper"
share = 90
[item.book.composition.cover]
material = "cardboard"
share = 10

[item.book.features.readable]
kind = "book"

