# Fasteners (domain B): consumables for joints (content-model §7, registry/fasteners.toml).
# Every fastener carries its items_tag (cat.fastener.*), use.fastener and `units` in the
# fastener's own unit (g of glue, wraps of cord/tape, twists of wire, ties, screws).
# nails_box and duct_tape live in materials.toml (exemplars; ids unchanged).
# Glue masses use `acrylic` as the closest registered polymer (proposal: `adhesive` material).

[item.screws_box]
name = "box of screws"
tags = ["cat.fastener.screw", "from.construction", "from.garage", "use.fastener"]
shape = "small"
dims_mm = [120, 80, 55]
mass_g = 480
units = 75
desc = "A one-pound box of three-inch coated deck screws."
glyph = "item.box_small"
why = "Strongest removable wood joint (screw Hold); boards up windows with a drill and comes back out cleanly."
brand_cats = ["tools"]
details = ["fastener_amount"]
value_class = "useful"

[item.screws_box.composition.screws]
material = "carbon_steel"
share = 94
[item.screws_box.composition.box]
material = "cardboard"
share = 6

[item.instant_glue]
name = "instant glue"
tags = ["cat.fastener.glue.instant", "from.garage", "from.kitchen", "from.office", "from.retail", "use.fastener"]
shape = "small"
dims_mm = [70, 20, 12]
mass_g = 10
units = 3
desc = "A tiny aluminum tube of cyanoacrylate glue with a pin cap."
glyph = "item.glue_tube"
why = "Instant bond for small hard parts (glasses, knife scales, cracked plastic); closes small cuts; useless on heavy or porous loads."
brand_cats = ["adhesives"]
details = ["fastener_amount"]
value_class = "useful"

[item.instant_glue.composition.tube]
material = "aluminum"
share = 60
[item.instant_glue.composition.adhesive]
material = "acrylic"
share = 40

[item.instant_glue.capabilities]
adhere = 4

# Cyanoacrylate is used in the field to close small lacerations (medical glue is a cousin).
[item.instant_glue.medical]
bleed_stop = 2
doses = 3

