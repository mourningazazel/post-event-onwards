[item.nylon_rope]
name = "nylon rope"
tags = ["cat.fastener.cord", "from.garage", "from.outdoors", "from.farm", "from.construction", "use.fastener", "use.shelter"]
shape = "cord"
dims_mm = [15240, 10, 10]          # uncoiled length first (cord convention)
mass_g = 820
units = 50
durability = 8
desc = "Fifty feet of 3/8-inch twisted white nylon rope."
glyph = "item.rope"
why = "Climbing and descent line, heavy lashing (crude mauls, loads), shelters, hauling; cord joints forgive impacts."
brand_cats = ["rope"]
modifiers = ["rope_100ft"]
attach_surface = { kind = "fibrous", contact_area_mm2 = 2000, wrap_girth_mm = 31 }
divisible = { mode = "length", min_piece_mm = 300, needs = "cut>=2" }
value_class = "valuable"

[item.nylon_rope.composition.rope]
material = "nylon_fabric"
share = 100

[item.paracord]
name = "paracord"
tags = ["cat.fastener.cord", "from.outdoors", "from.garage", "use.fastener", "use.shelter"]
shape = "cord"
dims_mm = [30480, 4, 4]
mass_g = 200
units = 80
durability = 8
desc = "A hank of a hundred feet of olive 550 parachute cord."
glyph = "item.rope"
why = "Light, strong line for lashing, snares, tripwires and shelters; inner strands pull out as thread; too thin to climb."
brand_cats = ["rope", "outdoors"]
attach_surface = { kind = "fibrous", contact_area_mm2 = 500, wrap_girth_mm = 13 }
divisible = { mode = "length", min_piece_mm = 100, needs = "cut>=1" }
value_class = "useful"

[item.paracord.composition.cord]
material = "nylon_fabric"
share = 100

# bind: derived 7 (very tough nylon fibre). A 4 mm line cuts into hands and lashings and
# can't take the same working load as 3/8-inch rope.
[item.paracord.capabilities]
bind = 5

