# Furniture: movable (with effort) world objects. Domain D (world-catalog §6.D).
# Gameplay roles: barricade mass (block_with_furniture needs >= 20 kg), sight blocking, seats and
# beds (rest), work surfaces, loot containers, secure storage (locks), and salvage (planks, slats,
# springs, kindling). Finishes/colours come from detail tables in modifiers/furniture_electronics.toml.
# `sofa` lives in items/household/household.toml (exemplar).
#
# Lock tiers (feature.lock.tier) across this domain roughly equal the security skill level a
# picker needs for a fair chance: 1 privacy latch · 2 furniture wafer lock · 3 locker/padlock ·
# 4 residential deadbolt · 7 commercial mortise · 15 safe (combination, not pickable).

