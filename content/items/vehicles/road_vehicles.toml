# Road vehicles as world objects (non-functional per setting, N005/P-WO-03): fuel to siphon,
# parts to salvage, loot space, cover and barricades. Colours, stickers and interior mess come
# from detail tables in modifiers/outdoor_vehicles.toml, not from extra archetypes (N011).
# Passenger vehicles that behave like the sedan inherit from it (car_sedan, cars.toml).

[item.suv]
name = "SUV"
parent = "car_sedan"
tags = ["cat.vehicle.suv", "from.street", "use.salvage", "use.barricade"]
dims_mm = [4900, 1950, 1780]
mass_g = 2100000
desc = "A tall five-door sport utility vehicle with a roof rack."
glyph = "obj.suv"
why = "Bigger tank than a sedan, roomy cargo area, tall enough to block sight; the most common family car."
