# Emergency vehicles: struggle-hotspot loot sources (N007 emergency_scene). Their gear (shotgun
# racks, trauma bags, tools) comes from world loot tables later, so no `contents` here.
# Sirens and light bars run off the vehicle battery while it holds charge.

[item.police_cruiser]
name = "police cruiser"
parent = "car_sedan"
tags = ["cat.vehicle.police", "from.police", "from.street"]
dims_mm = [5100, 1900, 1500]
mass_g = 1900000
desc = "A marked patrol car with a roof light bar, push bumper and a cage behind the front seats."
glyph = "obj.police_car"
why = "Loot source (long-gun rack, trunk gear, via world loot); siren is a battery-powered lure; light bar lights a scene."
