# Medical supplies (world-catalog §6.C; survival-actions §2.8, M15). Domain C.
#
# `medical` values, as used in this domain:
#   bleed_stop, disinfect, pain, splint, antibiotic, burn_care: 0..10 effect strength
#     (10 = purpose-built best in class: a windlass tourniquet on a limb bleed).
#   sterile: 0..10 cleanliness of what touches the wound (10 = sealed sterile; ~3 = clean but
#     not sterile; 0 = dirty or not a dressing).
#   doses: number of uses in the item (tablets, dressings); `units` mirrors it for the UI.
# Drug kinds and strengths come from detail tables (modifiers/clothing_personal.toml), not items.

