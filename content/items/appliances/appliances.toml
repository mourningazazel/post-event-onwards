[item.alarm_clock]
name = "alarm clock"
tags = ["cat.electronics.clock", "from.bedroom", "use.lure"]
shape = "complex"
dims_mm = [120, 100, 60]
mass_g = 250
use_noise = "very_loud"
desc = "A twin-bell wind-up style alarm clock (battery movement)."
glyph = "item.clock"
why = "Timed noise lure (P-EN-03); tells the time."
value_class = "useful"
power_use = { voltage = "dc_small", watts = 1 }

[item.alarm_clock.composition.case]
material = "abs"
share = 80
[item.alarm_clock.composition.bells]
material = "mild_steel"
