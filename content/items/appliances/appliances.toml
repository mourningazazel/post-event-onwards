[item.alarm_clock.features.alarm]
loudness = "very_loud"
timer = true
trigger = "timer"
[item.alarm_clock.features.slot]
accepts = "cat.battery.aa"
count = 2

[item.alarm_clock.capabilities]
timekeep = 5
