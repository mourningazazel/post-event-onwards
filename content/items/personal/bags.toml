# Bags (world-catalog §6.C). Domain C.
# G03 D3.1 capacity: container.capacity_ml (volume), max_mass_g (what the fabric/straps bear) and
# max_dim_mm (longest item that fits closed). The main compartment is the `container` feature;
# outer pockets are summed into one `pocket` feature; `strap` is how it is carried (load_g).
# Soft bags are mostly air inside a thin shell, so fill_pct is set from real shell mass.

[item.school_backpack]
name = "backpack"
tags = ["cat.bag.backpack", "from.school", "from.bedroom", "from.retail", "use.container", "slot.back"]
shape = "bag"
dims_mm = [450, 320, 180]
mass_g = 600
fill_pct = 2
absorbs_water = true
absorbs_scent = true
durability = 5
encumbrance = 1
desc = "A two-compartment polyester school backpack with padded straps."
glyph = "item.backpack"
why = "The first real carrying upgrade (M20, G03): hands free, ~22 L; everywhere in schools and homes."
brand_cats = ["clothing_basics", "outdoors"]
details = ["clothing_colour", "bag_decoration"]
value_class = "useful"

