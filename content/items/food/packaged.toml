# Packaged shelf food (domain A). Few archetypes; the kind (chili vs peaches, cereal vs pasta)
# comes from a *_kind detail table whose entries apply variant modifiers in
# modifiers/kitchen_food.toml. Those modifiers set the name, the food values and, where the
# package differs, dims/mass/material. Base values here are a sensible generic package.
#
# mass_g of packaged food is the whole package including the food (the food is not a substance).
# food.kcal is the whole package; servings split it.

# ---------------------------------------------------------------- cans
[item.canned_food]
name = "canned food"
tags = ["cat.food.canned", "cat.container.can", "from.kitchen", "from.grocery", "from.gas_station", "use.food"]
shape = "block"
dims_mm = [115, 76, 76]
mass_g = 470
heat_resistant = true              # the empty tinplate can boils water over a fire
desc = "A tinplate food can with a paper label."
glyph = "item.can"
why = "The backbone of scavenged calories: never spoils, but needs opening. The empty can boils water and rattles on a tripwire."
brand_cats = ["canned_food"]
details = ["canned_food_kind", "canned_lid", "canned_label"]
value_class = "useful"
food = { kcal = 400, servings = 2, hydration_ml = 150, perishable = "shelf_stable", needs_opening = true, cookable = false }

[item.canned_food.composition.can]
material = "mild_steel"
share = 11
[item.canned_food.composition.contents]
material = "food_wet"
share = 89

[item.canned_food.features.container]
capacity_ml = 430
opening_mm = 73
closable = false
compat = ["liquid", "granular", "solid"]

# The contents are the heaviest "material", but a steel can dents rather than splitting.
[item.canned_food.reactions.impact]
low = "none"
medium = "dent"
high = "dent"
# Sealed cans heated in a fire burst (steam pressure); warmed beside it they just heat through.
[item.canned_food.reactions.heat]
medium = "cook"
high = "burst"

