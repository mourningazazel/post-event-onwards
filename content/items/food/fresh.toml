# Perishable food (domain A): bread, produce, frozen food, raw meat. Spoilage runs on the clock
# (aftermath spoilage, ADR-0011; fridges/freezers only help while powered, N007). Kinds come
# from *_kind detail tables in modifiers/kitchen_food.toml.

[item.bread_loaf]
name = "sliced bread"
tags = ["cat.food.bread", "from.kitchen", "from.grocery", "from.gas_station", "use.food"]
shape = "block"
dims_mm = [300, 125, 115]
mass_g = 590
fill_pct = 35                      # airy crumb: bulk density ~0.2 g/cm3
desc = "A soft loaf of sliced bread in a twist-tied plastic bag."
glyph = "item.bread"
why = "Ready-to-eat calories in the first week; goes mouldy fast, so it dates a location's aftermath."
brand_cats = ["bread"]
details = ["bread_kind"]
value_class = "common"
food = { kcal = 1500, servings = 20, perishable = "short", needs_opening = false, cookable = false }

[item.bread_loaf.composition.contents]
material = "food_dry"
share = 97
[item.bread_loaf.composition.bag]
material = "ldpe"
share = 3

[item.fresh_produce]
