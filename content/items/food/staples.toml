# Bulk dry staples (domain A). These are bags holding a granular substance (M1): calories,
# perishability and density live on the substance (substances/granular.toml), so a half-used bag
# is simply less substance. mass_g is the empty bag.

[item.bag_of_rice]
name = "bag of rice"
tags = ["cat.food.staple", "from.kitchen", "from.grocery", "from.restaurant", "use.food"]
shape = "bag"
dims_mm = [300, 190, 70]
mass_g = 20
fill_pct = 1                       # a thin film bag; the rice is contents
desc = "A five-pound plastic bag of long-grain white rice."
glyph = "item.sack"
why = "Cheapest, longest-keeping calories (about 8,000 kcal per bag); needs water, fuel and a pot."
brand_cats = ["dry_food"]
value_class = "useful"

[item.bag_of_rice.composition.bag]
material = "ldpe"
share = 100

[item.bag_of_rice.features.container]
capacity_ml = 2700
closable = false
sealable = false
compat = ["granular"]

[item.bag_of_rice.contents]
substance = "rice"
fill_pct = [20, 100]

