# Packaged drinks (domain A). Drinks are containers holding a substance (M1): hydration and
# kcal come from the substance (substances/liquids.toml), so they can be poured, boiled, mixed
# or spilled like any liquid. mass_g is the empty package.

[item.bottled_water]
name = "bottled water"
tags = ["cat.drink.water", "cat.container.bottle", "from.kitchen", "from.grocery", "from.gas_station", "from.office", "from.vehicle", "use.drink", "use.container"]
shape = "container"
dims_mm = [205, 65, 65]
mass_g = 12
desc = "A half-litre bottle of spring water with a plastic screw cap."
glyph = "item.bottle"
why = "Safe water in a sealed, refillable, light bottle: the single most important find in the first weeks."
brand_cats = ["water"]
modifiers = ["water_gallon"]
value_class = "useful"

[item.bottled_water.composition.bottle]
material = "pet"
share = 85
[item.bottled_water.composition.cap]
material = "polypropylene"
share = 15

[item.bottled_water.features.container]
capacity_ml = 500
opening_mm = 28
closable = true
sealable = true
watertight = true
compat = ["liquid"]
[item.bottled_water.features.lid]
kind = "screw"
reclosable = true

[item.bottled_water.contents]
substance = "water"
fill_pct = [100, 100]

