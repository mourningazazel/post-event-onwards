# Clothing: tops and jackets (world-catalog §6.C). Domain C.
#
# Conventions for every garment in items/clothing/:
# - dims_mm is the garment laid flat (length x width x doubled-fabric thickness); shape "fabric".
# - insulation_clo10: clo x 10 (a T-shirt ~0.1 clo -> 1; a heavy parka ~2.5 clo -> 25).
# - waterproof / windproof: 0..10 (10 = sealed membrane / rubber).
# - armor { blunt, cut, pierce, bite } 0..10. Bite is the one that matters (M16): thin knits and
#   wovens ~0; thick denim/canvas 2; thick knits and padding 1-2; leather 5; aramid panels 8.
#   Human jaws crush rather than slice, so padding helps a little and dense tough fibre a lot.
# - absorbs_scent: every textile holds sweat scent; synthetics notoriously so (M14).
# - Colour, prints, fit and occupational markings come from detail tables (N011), never new items.

