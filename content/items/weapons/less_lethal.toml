# Police and civilian less-lethal gear. Whether pepper spray or a taser affects the dead at all
# is an open question for the owner (reported); modelled as the real objects.

[item.police_baton]
name = "expandable baton"
tags = ["cat.weapon.baton", "from.police", "use.weapon"]
shape = "rod"
dims_mm = [530, 32, 32]
mass_g = 500
hollow = true
balance = "head"
durability = 8
desc = "A 21-inch friction-lock steel baton that snaps out from a 20 cm handle."
glyph = "item.baton"
why = "Pocketable steel club, one-handed; the telescoping sections collapse under side load, so it can't pry."
value_class = "useful"

[item.police_baton.composition.shaft]
material = "carbon_steel"
share = 80
[item.police_baton.composition.grip]
material = "rubber"
share = 15
[item.police_baton.composition.tip]
material = "carbon_steel"
share = 5

[item.police_baton.features.grip]
hands = 1
girth_mm = 30
[item.police_baton.features.strap]
kind = "belt"
load_g = 1000

[item.police_baton.capabilities]
pry = 3

[item.pepper_spray]
name = "pepper spray"
tags = ["cat.weapon.spray", "from.police", "from.bedroom", "from.retail", "use.weapon", "hazard.pressurized"]
shape = "complex"
dims_mm = [165, 45, 45]
mass_g = 140
pressurized = true
units = 10
use_noise = "quiet"
desc = "A police-size canister of capsicum spray with a flip-top actuator."
glyph = "item.spray_can"
why = "Blinds and chokes the living (survivors, raiders); its effect on the dead is doubtful; bursts in a fire."
value_class = "common"

[item.pepper_spray.composition.can]
material = "aluminum"
share = 60
[item.pepper_spray.composition.actuator]
material = "polypropylene"
share = 40

[item.pepper_spray.reactions.heat]
