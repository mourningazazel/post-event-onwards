# Firearms (survival-actions §5 Q2: realistic US availability, extreme noise, scarce ammo).
# Generic types only, no real models. Feeding: pistol and rifle take a magazine (slot accepts a
# cat.magazine.* tag); revolver, shotgun and bolt rifle load cartridges directly (cat.ammo.*).
# Ranged-fire vocabulary (range, accuracy, damage) doesn't exist yet: see the domain E report.

