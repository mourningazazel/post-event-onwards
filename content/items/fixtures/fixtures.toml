# Fixtures: built-in world objects (fixed = true unless noted). Domain D (world-catalog §6.D).
# Gameplay roles: access (doors/windows: lock tiers, impact outcomes, boardable openings), water
# sources (toilet cistern, water heater, bathtub, taps), fixed heat (fireplace, wood stove) and
# alarms. `radiator` lives in items/household/household.toml (exemplar).
#
# Impact overrides (reactions.impact) are authored where the material default would be wrong for
# an assembly: a solid door does not "bend", a tempered storefront shrugs off a pebble.
# Lock tiers: see the scale in items/furniture/furniture.toml.

