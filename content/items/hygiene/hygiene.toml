# Hygiene and toiletries (world-catalog §6.C). Domain C.
# Scent (M14, scent-mobs.md): soaps wash absorbed scent out of skin and clothes (action.wash);
# perfume and deodorant add a perfume-channel signature that masks human scent at close range.
# `emits.*` on an item means the closed item itself leaks that scent (perfume bottles do).

[item.soap_bar]
name = "bar of soap"
tags = ["cat.hygiene.soap", "from.bathroom", "from.grocery", "from.retail", "use.soap", "use.hygiene"]
shape = "block"
dims_mm = [90, 60, 30]
mass_g = 110
desc = "A paper-wrapped bar of scented soap."
glyph = "item.soap"
why = "Washes absorbed scent off skin and clothes (M14 wash); compact and never spoils."
brand_cats = ["personal_care"]
value_class = "useful"

[item.soap_bar.composition.soap]
material = "wax"   # stand-in for saponified fat (no soap material yet; see proposals)
share = 95
[item.soap_bar.composition.wrapper]
material = "paper"
share = 5

