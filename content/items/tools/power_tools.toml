# Power tools, power sources for them, and vehicle/electrical kit (domain B).
# Power: corded tools declare power_use ac_mains (grid while it lasts, then a generator);
# cordless tools take a drill_battery in a slot (cat.battery.drill). The 18-20 V tool-pack
# class has no voltage id yet, so packs use dc_small (proposal: dc_tool, see report).

[item.cordless_drill]
name = "cordless drill"
tags = ["cat.tool.power", "from.garage", "from.construction", "use.tool"]
shape = "complex"
dims_mm = [230, 200, 80]
mass_g = 1400
durability = 7
use_noise = "normal"
desc = "An 18-volt drill/driver with a keyless chuck, a belt clip and a case of bits."
glyph = "item.drill"
why = "Drives screws fast (plywood window boards), bores holes in wood, sheet metal and fuel tanks; needs a charged pack."
brand_cats = ["power_tools"]
modifiers = ["cheap"]
details = ["tool_wear_marks"]
value_class = "valuable"
power_use = { voltage = "dc_small", watts = 400 }

[item.cordless_drill.composition.housing]
material = "nylon"
share = 35
[item.cordless_drill.composition.motor]
material = "copper"
share = 20
[item.cordless_drill.composition.gearbox]
material = "mild_steel"
share = 30
[item.cordless_drill.composition.chuck]
material = "carbon_steel"
share = 15

[item.cordless_drill.features.grip]
hands = 1
girth_mm = 40
[item.cordless_drill.features.slot]
accepts = "cat.battery.drill"
count = 1

[item.cordless_drill.capabilities]
