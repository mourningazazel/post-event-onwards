# Security / entry tools (N013: locks are pickable ONLY with a lockpick set — a rare find).

[item.lockpick_set]
name = "lockpick set"
tags = ["cat.tool.lockpick", "from.bedroom", "from.garage", "from.police", "use.lockpick", "use.tool"]
shape = "small"
dims_mm = [150, 70, 15]
mass_g = 90
fill_pct = 30
desc = "A zippered faux-leather pouch of steel picks, rakes and tension wrenches."
