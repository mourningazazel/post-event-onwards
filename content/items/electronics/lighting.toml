# Light sources: electric, liquid-fuel, candle and chemical. Domain D (world-catalog §6.D).
# light.radius_m is what capability `light` derives from (M11). Durations are for one fill /
# one set of fresh alkaline cells on a practical setting. Masses exclude batteries and fuel.
# Non-electric lights use cat.light.*; electric ones cat.electronics.light.

