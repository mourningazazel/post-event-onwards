# Electronic devices: radios, power, computers, screens. Domain D (world-catalog §6.D).
# Most computers/screens earn their place as salvage (copper wire, batteries) and as world-building;
# radios and walkie-talkies are noise lures; power banks and solar panels keep small devices alive
# after the grid fails (N007). `tv_remote` and `alarm_clock` live in items/appliances/.

[item.emergency_radio]
name = "emergency radio"
tags = ["cat.electronics.radio", "from.living", "from.garage", "from.outdoors", "from.retail", "use.power", "use.light_source", "use.signal", "use.lure"]
shape = "complex"
dims_mm = [170, 80, 65]
mass_g = 400
desc = "A hand-crank weather radio with a built-in LED torch, a USB outlet and a siren button."
glyph = "item.radio"
why = "Cranked, it recharges itself (and a phone, slowly); siren is a noise lure; broadcasts are lore (M21)."
brand_cats = ["radios"]
value_class = "valuable"
power_source = { voltage = "dc_small", capacity_wh = 4, rechargeable = true, output_w = 2 }

[item.emergency_radio.composition.case]
material = "abs"
share = 70
[item.emergency_radio.composition.crank_dynamo]
material = "copper"
share = 15
salvage = { item = "copper_wire", count = 1, set = { dims_mm = [3000, 1, 1], mass_g = 20 }, tool = "fasten>=2", time_s = 300 }
[item.emergency_radio.composition.speaker]
material = "mild_steel"
share = 10
[item.emergency_radio.composition.lens]
material = "polycarbonate"
share = 5

[item.emergency_radio.features.light]
radius_m = 4
beam = "cone"
duration_min = 60
fuel = "battery"
[item.emergency_radio.features.alarm]
loudness = "loud"
timer = false
trigger = "touch"
[item.emergency_radio.features.slot]
accepts = "cat.battery.aa"
count = 3
[item.emergency_radio.features.strap]
kind = "handle"
load_g = 2000

[item.emergency_radio.capabilities]
noise = 6

