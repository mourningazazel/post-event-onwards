# Kitchen consumables: bags, foil, towels, soap (domain A). Each is one pack; `units` counts
# what's inside. Only kept because each has survival uses beyond its kitchen job (N011).

[item.trash_bags]
name = "box of trash bags"
tags = ["cat.household.bags", "from.kitchen", "from.grocery", "from.garage", "use.container", "use.shelter"]
shape = "block"
dims_mm = [250, 130, 75]
mass_g = 700
units = 40
desc = "A box of forty 13-gallon drawstring trash bags."
glyph = "item.box"
why = "Rain catchment liners, ground sheets, emergency ponchos and bulk carry sacks; scent-proofing for bodies and waste."
brand_cats = ["household"]
value_class = "useful"

[item.trash_bags.composition.bags]
material = "ldpe"
share = 90
[item.trash_bags.composition.box]
material = "paper"
share = 10

[item.trash_bags.features.container]
capacity_ml = 49000
opening_mm = 600
closable = true
sealable = false
compat = ["liquid", "granular", "solid"]

[item.trash_bags.capabilities]
waterproof = 6                     # override: a bag with head and arm holes is a real emergency poncho

