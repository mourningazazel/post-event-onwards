# Domain A (kitchen, food, drink) expectations: pinned derivations, reactions, names from
# modifiers, and food values (N002 intended-use tests). Values hand-computed from derive.py.

# ---------------------------------------------------------------- cookware as weapons/tools
[[expect]]
item = "frying_pan"
path = "cap.hammer"
op = "=="
value = 9
why = "(log2(2300/50) + cast iron 6/3) x 1.2 striking face = 9.03: the skillet is a top-tier bludgeon"

[[expect]]
item = "frying_pan"
path = "impact.medium"
op = "=="
value = "none"
why = "authored: a thick cast-iron skillet survives a thrown/swung hit"

[[expect]]
item = "frying_pan"
path = "impact.high"
op = "=="
value = "crack"
why = "cast iron cracks from a hard high-energy impact"

[[expect]]
item = "frying_pan"
path = "heat_resistant"
op = "=="
value = true

[[expect]]
item = "frying_pan"
mods = ["aluminum_cookware"]
path = "name"
op = "=="
value = "aluminum frying pan"

[[expect]]
item = "frying_pan"
mods = ["aluminum_cookware"]
path = "cap.hammer"
op = "=="
value = 7
why = "920 g aluminum: (log2(18.4) + 4/3) x 1.2 = 6.64 — lighter pan, weaker hit"

[[expect]]
item = "frying_pan"
mods = ["aluminum_cookware"]
path = "impact.medium"
op = "=="
value = "dent"
why = "authored cast-iron reactions removed; aluminum (tough) dents"

[[expect]]
item = "frying_pan"
mods = ["aluminum_cookware"]
path = "tags"
op = "has"
value = "hazard.fumes"
why = "overheated nonstick coating gives off toxic fumes"

[[expect]]
item = "cleaver"
path = "cap.cut"
op = "=="
value = 4
why = "sharpness 6 x stainless edge_holding 6 / 10 = 3.6"

[[expect]]
item = "cleaver"
path = "cap.chop"
op = "=="
value = 3
why = "cut 4 x 800/1200 x 1.3 head-heavy = 3.47; the only kitchen item that chops"

[[expect]]
item = "cleaver"
path = "cap.pierce"
op = "=="
value = 0
why = "a cleaver has no point"

[[expect]]
item = "can_opener"
path = "cap.can_open"
op = ">="
value = 5

[[expect]]
item = "rolling_pin"
path = "cap.hammer"
op = "=="
value = 5
why = "log2(800/50) + hardwood 4/3 = 5.33"

[[expect]]
item = "rolling_pin"
path = "cap.pry"
op = "=="
value = 1
why = "authored override: a round pin has no edge to lever with"

[[expect]]
item = "cutlery"
path = "cap.can_open"
op = "=="
value = 1
why = "the slow spoon-on-the-seam method"

[[expect]]
item = "cutlery"
path = "cap.fasten"
op = "=="
value = 1
why = "a table knife as a poor screwdriver: not enough for fasten>=2 salvage"

[[expect]]
item = "cutlery"
path = "cap.hammer"
op = "=="
value = 2

[[expect]]
item = "fire_extinguisher"
path = "cap.extinguish"
op = ">="
value = 5

[[expect]]
item = "fire_extinguisher"
path = "pressurized"
op = "=="
value = true

[[expect]]
item = "fire_extinguisher"
path = "reactions.heat.high"
op = "=="
value = "burst"

[[expect]]
item = "fire_extinguisher"
path = "cap.hammer"
op = "=="
value = 8
why = "log2(3900/50) + steel 6/3 = 8.29: a heavy steel cylinder"

