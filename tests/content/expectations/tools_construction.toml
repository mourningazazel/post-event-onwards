# Domain B pinned derivations and data relationships (tools, construction, fasteners, fuel,
# salvage). Values hand-computed from tools/content/derive.py; "authored" marks overrides.

# ---- saws vs materials (saw_edge: coarse 5, fine 7; grinder authored 9) ----
[[expect]]
item = "handsaw"
path = "cap.saw"
op = "=="
value = 5
why = "coarse wood saw: beats softwood 3 / hardwood 4 / plywood 3, not mild steel 6"

[[expect]]
item = "hacksaw"
path = "cap.saw"
op = "=="
value = 7
why = "fine metal saw: mild steel 6 and carbon steel 7, not hardened tool steel 8"

[[expect]]
item = "circular_saw"
path = "cap.saw"
op = "=="
value = 5
why = "carbide framing blade is a coarse wood saw"

[[expect]]
item = "chainsaw"
path = "cap.saw"
op = "=="
value = 5

[[expect]]
item = "angle_grinder"
path = "cap.saw"
op = "=="
value = 9
why = "authored: abrasive disc outcuts tool steel (8)"

# ---- cutting edges ----
[[expect]]
item = "bolt_cutters"
path = "cap.cut"
op = "=="
value = 7
why = "sharpness 8 x tool-steel head edge_holding 9 / 10 = 7.2: shears mild and carbon steel"

[[expect]]
item = "bolt_cutters"
path = "cap.chop"
op = "=="
value = 1
why = "authored override of derived 7: shear jaws don't hack"

[[expect]]
item = "wire_cutters"
path = "cap.cut"
op = "=="
value = 6
why = "8 x carbon steel 7 / 10 = 5.6: cuts mild-steel wire (6)"

[[expect]]
item = "tin_snips"
path = "cap.cut"
op = "=="
value = 6
why = "9 x 7 / 10 = 6.3: cuts galvanized sheet (mild steel 6)"

[[expect]]
item = "utility_knife"
path = "cap.cut"
op = "=="
value = 5
why = "authored override of derived 6: keen, but no leverage to shear steel"

[[expect]]
item = "axe"
path = "cap.chop"
op = "=="
value = 7
why = "cut 5 x min(1, 2400/1200) x 1.3 head balance = 6.5"

[[expect]]
item = "hatchet"
path = "cap.chop"
op = "=="
value = 5
why = "cut 5 x 900/1200 x 1.3 = 4.9"

[[expect]]
item = "hatchet_head"
path = "cap.chop"
op = "=="
value = 3
why = "a loose head has no haft leverage: 5 x 600/1200 = 2.5"

[[expect]]
item = "glass_shards"
path = "cap.pierce"
op = "=="
value = 7

[[expect]]
item = "glass_shards"
path = "impact.low"
op = "=="
value = "shatter"

