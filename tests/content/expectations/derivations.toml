# Pinned derivation results (executable spec, N002/N011). Values hand-computed from
# tools/content/derive.py formulas; the C++ port must reproduce them exactly.

# ---- cutting / piercing (edge, point) ----
[[expect]]
item = "kitchen_knife"
path = "cap.cut"
op = "=="
value = 4
why = "sharpness 7 x stainless edge_holding 6 / 10 = 4.2"

[[expect]]
item = "kitchen_knife"
path = "cap.pierce"
op = "=="
value = 6
why = "point 7 x blade rigidity 9 / 10 = 6.3"

[[expect]]
item = "kitchen_knife"
path = "cap.chop"
op = "<="
value = 1
why = "a light knife barely chops (cut 4 x 150/1200)"

[[expect]]
item = "kitchen_knife"
path = "cap.hammer"
op = "=="
value = 4
why = "log2(150/50) + 6/3 = 3.58"

