# Domain D pinned expectations: furniture, fixtures, electronics, lighting, paper, fire.
# Values hand-computed from tools/content/derive.py and the authored data.

# ---- openings: door vs window impact outcomes (M8/M10/M13) ----
[[expect]]
item = "window_house"
path = "impact.medium"
op = "=="
value = "shatter"
why = "a thrown brick goes through ordinary glass"

[[expect]]
item = "window_house"
path = "impact.low"
op = "=="
value = "crack"
why = "a pebble cracks annealed glass without opening it"

[[expect]]
item = "window_house"
path = "tags"
op = "has"
value = "hazard.sharp_debris"
why = "annealed glass leaves cutting shards"

[[expect]]
item = "window_storefront"
path = "impact.low"
op = "=="
value = "none"
why = "tempered glass shrugs off light hits"

[[expect]]
item = "window_storefront"
path = "impact.medium"
op = "=="
value = "shatter"

[[expect]]
item = "door_interior"
path = "impact.medium"
op = "=="
value = "split"
why = "hollow-core skin splits under a kick"

[[expect]]
item = "door_exterior"
path = "impact.medium"
op = "=="
value = "none"
why = "solid wood door ignores a normal hit"

[[expect]]
item = "door_exterior"
path = "impact.high"
op = "=="
value = "crack"

[[expect]]
item = "door_steel"
path = "impact.high"
op = "=="
value = "dent"
why = "steel doors dent, never break open"

[[expect]]
item = "door_interior"
path = "throw_range"
op = "=="
value = 0
why = "fixtures can't be thrown"

