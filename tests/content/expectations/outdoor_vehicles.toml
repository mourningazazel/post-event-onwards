# Domain E pinned derivations and data relationships: vehicles, street, garden, farm,
# outdoors, sports, weapons. Values hand-computed from tools/content/derive.py.

# ---- melee: bat vs golf club ----
[[expect]]
item = "baseball_bat"
path = "cap.hammer"
op = "=="
value = 6
why = "body hardwood: log2(900/50) + 4/3 = 5.50"

[[expect]]
item = "golf_club"
path = "cap.hammer"
op = "=="
value = 5
why = "head stainless: log2(430/50) + 6/3 = 5.10; lighter than a bat"

[[expect]]
item = "golf_club"
path = "cap.hammer"
op = "<"
value = 6
why = "a golf club is a worse bludgeon than a baseball bat"

[[expect]]
item = "golf_club"
path = "impact.high"
op = "=="
value = "bend"
why = "thin steel shaft bends on a hard swing"

[[expect]]
item = "baseball_bat"
mods = ["bat_aluminum"]
path = "name"
op = "=="
value = "aluminum baseball bat"

[[expect]]
item = "baseball_bat"
mods = ["bat_aluminum"]
path = "cap.hammer"
op = "=="
value = 5
why = "aluminium bats weigh nearly the same as wood (855 g, not the generic x0.4): log2(855/50) + 4/3 = 5.43"

[[expect]]
item = "baseball_bat"
path = "cap.pry"
op = "=="
value = 1
why = "authored: a round bat has no thin end to lever with"

