name: CI

# The build jobs only. A push or PR that changes nothing the build reads (docs, the
# queue, briefs, skills, agents, content tables) skips this workflow; docs.yml still
# runs for it (D-044). tools/ stays in: ctest runs tools/suite_budget.py.
on:
  push:
    branches: [main, "claude/**"]
    paths-ignore:  # keep both lists identical; workflow YAML has no anchors
      - "docs/**"
      - "**/*.md"
      - "WORK_QUEUE.json"
      - "DEFERRED_WORK.json"
      - ".agents/**"
      - ".claude/**"
      - ".githooks/**"
      - "content/**"
      - ".gitignore"
      - ".editorconfig"
      - ".gitattributes"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "WORK_QUEUE.json"
      - "DEFERRED_WORK.json"
      - ".agents/**"
      - ".claude/**"
      - ".githooks/**"
      - "content/**"
      - ".gitignore"
      - ".editorconfig"
      - ".gitattributes"

# Pull requests and claude/** branches: a newer push supersedes the older run.
# main: every push gets its own result (PEO-032). The Builder pushes one unit at
# a time, so a shared group would cancel all but the last run, and a queued run
# is replaced even without cancel-in-progress; hence a group per run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: |
          clang-format-18 --dry-run -Werror $(git ls-files 'src/**/*.cpp' 'src/**/*.hpp' 'tests/**/*.cpp' 'tests/**/*.hpp')

  core-tests:
    name: core tests (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc-13, cxx: g++-13, pkgs: g++-13 }
          - { cc: clang-18, cxx: clang++-18, pkgs: "clang-18 libclang-rt-18-dev" }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.pkgs }}
      - run: cmake --preset headless
      - run: cmake --build --preset headless
      - run: ctest --preset headless

  core-tsan:
    # PEO-080 (D-035): the executor and the passes it splits, on real threads, under
    # ThreadSanitizer. Any report fails the job (halt_on_error).
    name: core threads (tsan)
    runs-on: ubuntu-latest
    env:
      CC: clang-18
      CXX: clang++-18
      TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev
      - run: cmake --preset headless-tsan
      - run: cmake --build --preset headless-tsan
      - run: ./build/headless-tsan/tests/peo_core_tests --no-intro -ts='executor'
      - run: ./build/headless-tsan/tests/peo_core_tests --no-intro -tc='serial*,the scent wave on the town*'

  gpu-lavapipe:
    # PEO-081 (ADR-0001, ADR-0014): peo_gpu built with its shaders and its tests run on
    # Mesa's lavapipe (Vulkan on the CPU). A skipped run (no device) fails the job.
    name: gpu field (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools mesa-vulkan-drivers libvulkan1 libvulkan-dev
      - uses: actions/cache@v4
        with:
          path: build/headless-release/_deps
          key: sdl3-headless-${{ hashFiles('cmake/FindOrFetchSDL3.cmake') }}
      - run: cmake --preset headless-release
      - run: cmake --build --preset headless-release --target peo_gpu_tests
      - run: |
          ./build/headless-release/tests/gpu/peo_gpu_tests --no-intro -s | tee gpu.log
          if grep -q "no Vulkan device" gpu.log; then echo "GPU tests were skipped"; exit 1; fi
          grep -q "GPU ran" gpu.log

  core-release:
    name: core tests (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset headless-release
      - run: cmake --build --preset headless-release
      - run: ctest --preset headless-release

  frontend:
    name: frontend build (linux, SDL3 from source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libgl1-mesa-dev libasound2-dev libpulse-dev libdbus-1-dev libudev-dev
      - uses: actions/cache@v4
        with:
          path: build/release/_deps
          key: sdl3-${{ hashFiles('cmake/FindOrFetchSDL3.cmake') }}
      - run: cmake --preset release
      - run: cmake --build --preset release
      - run: ctest --preset release
